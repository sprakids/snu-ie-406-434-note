<!doctype html><html lang="ko"><head><script src="/campus-theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입력 확인 · 산업공학의 이해 빈칸노트</title>
<style>body{max-width:900px;margin:24px auto;padding:0 20px;font:16px/1.7 system-ui,sans-serif;color:#273c4b}h1{font-size:24px}section{border:1px solid #d8e3eb;border-radius:12px;padding:18px;margin:18px 0}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:8px;border:1px solid #b8cad8;border-radius:6px}input{width:100%;box-sizing:border-box}button{cursor:pointer;background:#e9f3fa}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#647784}a{color:#0f0f70}</style><link rel="stylesheet" href="/campus.css"><link rel="stylesheet" href="/campus-effects.css"><script defer src="/campus-effects.js"></script><script defer src="/campus-navigation.js"></script><link rel="stylesheet" href="/campus-theme.css"><script defer src="/campus-curves.js"></script><meta name="theme-color" content="#19398a"></head><body class="campus-input-check"><header class="campus-utility-header"><a class="campus-logo-link" href="/" aria-label="메인 화면으로 이동"><span class="campus-logo-art"><img class="campus-brand-logo" src="/assets/snu-ie-logo.jpg" width="210" height="70" alt="서울대학교 산업공학과"><img class="campus-brand-logo campus-logo-dark" src="/assets/snu-ie-logo-dark.png" width="210" height="70" alt="" aria-hidden="true"></span></a><button type="button" class="theme-toggle" role="switch" aria-checked="false" aria-label="다크 모드" data-theme-toggle title="다크 모드로 전환"><span class="theme-label" aria-hidden="true">다크 모드</span><span class="theme-track" aria-hidden="true"><span class="theme-knob"></span></span></button></header>
<h1>한글 입력 확인</h1><p><a href="/">빈칸노트로 돌아가기</a></p>
<p>같은 문장을 첫 칸에 입력한 뒤 외장 키보드의 Tab으로 둘째 칸으로 이동해 비교해 보세요. 이 화면의 입력은 저장하거나 서버에 전송하지 않습니다.</p>
<section><h2>기본 입력창</h2><p class="muted">입력 이벤트를 처리하는 코드가 없는 일반 입력창입니다.</p><label>기본 첫째 칸<input id="plain-first" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></label><label>기본 둘째 칸<input id="plain-second" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></label></section>
<section id="guarded"><h2>수정된 입력 처리</h2><label>수정 첫째 칸<input id="safe-first" data-id="first" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></label><label>수정 둘째 칸<input id="safe-second" data-id="second" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></label><p id="manual-status" class="muted">입력 후 Tab으로 이동해 보세요.</p></section>
<button id="inspect" type="button">입력 결과 확인</button><pre id="manual-result"></pre>
<section><h2>이벤트 순서 모의 검사</h2><p>자동 검사는 입력 이벤트 처리와 값 보존을 검사합니다. 실제 iPad 한글 입력기를 재현하는 검사는 아닙니다.</p><button id="run-tests" type="button">자동 검사 실행</button><pre id="test-result">검사 대기</pre><div id="scratch"></div></section>
<script src="/note-input-safety.js"></script><script>
(() => {
 const $=id=>document.getElementById(id), sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const drafts={};
 const manual=NoteInputSafety.install({root:$('guarded'),onDraft:field=>{drafts[field.dataset.id]=field.value;},onPersist:()=>{},onSettled:()=>{$('manual-status').textContent='입력한 내용을 그대로 유지했습니다.';},onEnter:()=>{$('manual-status').textContent='조합 확정 후 Enter를 처리했습니다.';}});
 $('inspect').onclick=async()=>{await manual.settle();$('manual-result').textContent=JSON.stringify({기본:[$('plain-first').value,$('plain-second').value],수정:[$('safe-first').value,$('safe-second').value]},null,2);};
 const assert=(condition,message)=>{if(!condition)throw Error(message);};
 const fire=(field,type,init={})=>{
  const event=type.startsWith('key')?new KeyboardEvent(type,{bubbles:true,cancelable:true,...init}):type.startsWith('composition')?new CompositionEvent(type,{bubbles:true,...init}):new InputEvent(type,{bubbles:true,cancelable:type==='beforeinput',...init});
  field.dispatchEvent(event);return event;
 };
 function fixture(settings={}){
  const root=document.createElement('div');root.innerHTML='<input type="text" data-id="a"><input type="text" data-id="b"><textarea data-id="c"></textarea>';$('scratch').append(root);
  const [a,b,c]=root.querySelectorAll('input,textarea'),values={},log={ui:0,persist:0,enter:[],drafts:[],reveal:0};
  const controller=NoteInputSafety.install({...settings,root,onReveal:settings.revealShortcut?()=>{log.reveal++;}:undefined,onDraft:field=>{values[field.dataset.id]=field.value;log.drafts.push(field.dataset.id);},onPersist:()=>{log.persist++;},onSettled:()=>{log.ui++;},onEnter:field=>{log.enter.push(field.dataset.id);}});
  const input=(field,value,init={})=>{field.value=value;fire(field,'input',{inputType:'insertText',...init});};
  return{root,a,b,c,values,log,controller,input};
 }
 const cases=[
  ['입력 중 화면 갱신 없이 원문 보존',async f=>{f.a.focus();f.input(f.a,'  인적 자원  ');await sleep(280);assert(f.values.a==='  인적 자원  ','공백 또는 원문 변경');assert(f.log.ui===0,'입력 중 DOM 갱신');assert(f.log.persist>0,'초안 저장 누락');}],
  ['Tab 기본 동작과 입력창 유지',async f=>{f.a.focus();f.input(f.a,'안녕하세요');const event=fire(f.a,'keydown',{key:'Tab'});assert(!event.defaultPrevented,'Tab 차단');f.b.focus();await sleep(60);assert(f.root.firstElementChild===f.a&&f.a.value==='안녕하세요','입력창 교체');assert(f.b.value==='','다음 칸 값 오염');assert(f.log.ui===0,'다음 칸 편집 중 화면 갱신');}],
  ['조합 이벤트 없는 한글 교체 입력',async f=>{f.a.focus();f.input(f.a,'ㄱ');f.input(f.a,'',{inputType:'deleteContentBackward'});f.input(f.a,'가');f.b.focus();f.input(f.b,'나');assert(f.values.a==='가'&&f.values.b==='나','칸별 값 혼합');}],
  ['이전 칸에 늦게 온 입력도 해당 칸에 보존',async f=>{f.a.focus();f.input(f.a,'하세');f.b.focus();f.input(f.a,'하세요');assert(f.values.a==='하세요'&&f.b.value==='','지연 이벤트를 다른 칸으로 복사');}],
  ['조합 중 Enter는 채점하지 않음',async f=>{f.a.focus();fire(f.a,'compositionstart');f.input(f.a,'가',{isComposing:true,inputType:'insertCompositionText'});fire(f.a,'keydown',{key:'Enter',isComposing:true});fire(f.a,'keyup',{key:'Enter',isComposing:true});await sleep(60);assert(!f.log.enter.length,'조합 중 채점');}],
  ['isComposing=false, keyCode=229 방어',async f=>{f.a.focus();f.input(f.a,'가');fire(f.a,'keydown',{key:'Enter',keyCode:229});fire(f.a,'keyup',{key:'Enter',keyCode:229});await sleep(60);assert(!f.log.enter.length,'IME Enter 오인');}],
  ['조합 이벤트 누락 후 확정 Enter 방어',async f=>{f.a.focus();f.input(f.a,'하세');fire(f.a,'keydown',{key:'Enter'});f.input(f.a,'하세요');fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(!f.log.enter.length&&f.values.a==='하세요','확정 Enter 오인');}],
  ['keyup 뒤에 도착한 확정 입력 방어',async f=>{f.a.focus();f.input(f.a,'하세');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});f.input(f.a,'하세요');await sleep(60);assert(!f.log.enter.length,'늦은 확정 전에 채점');}],
  ['조합 종료 직후 Enter 방어',async f=>{f.a.focus();fire(f.a,'compositionstart');f.input(f.a,'가',{isComposing:true});fire(f.a,'compositionend');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(!f.log.enter.length,'종료 직후 채점');}],
  ['별도 Enter는 포커스 이동 없이 한 번 채점',async f=>{f.a.focus();f.input(f.a,'가');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(f.log.enter.length===1&&document.activeElement===f.a,'Enter 또는 포커스 오류');}],
  ['Enter 후 다른 칸으로 이동하면 지연 채점 취소',async f=>{f.a.focus();f.input(f.a,'가');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});f.b.focus();await sleep(60);assert(!f.log.enter.length&&f.b.value==='','포커스 이동 뒤 채점');}],
  ['blur 시 최종 값 확인',async f=>{f.a.focus();f.input(f.a,'하세');f.a.value='하세요';f.b.focus();assert(f.values.a==='하세요','최종 값 누락');}],
  ['조합 확정 전 렌더링 연기',async f=>{f.a.focus();f.input(f.a,'가');let ran=false;const deferred=f.controller.deferAction(()=>{ran=true;});assert(deferred&&!ran,'즉시 화면 교체');await sleep(90);assert(ran&&f.values.a==='가','확정 후 처리 누락');}],
  ['장 전환 전 조합 확정·저장',async f=>{f.a.focus();f.input(f.a,'공정');f.a.value='공정성이론';await f.controller.settle();assert(f.values.a==='공정성이론'&&document.activeElement!==f.a,'장 전환 확정 실패');}],
  ['문장 Enter는 줄바꿈, Ctrl+Enter는 채점',async f=>{f.c.focus();f.input(f.c,'문장');assert(!fire(f.c,'keydown',{key:'Enter'}).defaultPrevented,'줄바꿈 차단');fire(f.c,'keyup',{key:'Enter'});await sleep(50);assert(!f.log.enter.length,'줄바꿈을 채점');assert(fire(f.c,'keydown',{key:'Enter',ctrlKey:true}).defaultPrevented,'Ctrl+Enter 줄바꿈 방지 실패');fire(f.c,'keyup',{key:'Enter',ctrlKey:true});await sleep(60);assert(f.log.enter.length===1,'문장 채점 누락');}],
  ['반복 글자·이모지·삭제를 임의 보정하지 않음',async f=>{f.a.focus();f.input(f.a,'가가🙂');f.b.focus();f.input(f.b,'가가🙂');assert(f.values.a==='가가🙂'&&f.values.b==='가가🙂','정상 반복 문자 삭제');f.input(f.b,'');assert(f.values.b==='','빈 값 삭제 누락');}],
  ['페이지 이탈 때 마지막 초안 저장',async f=>{f.a.focus();f.input(f.a,'가');f.a.value='각';window.dispatchEvent(new Event('pagehide'));assert(f.values.a==='각'&&f.log.persist>0,'이탈 시 값 누락');}],
  ['입력 값 재설정 없음',async f=>{f.a.focus();const descriptor=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');let writes=0;Object.defineProperty(f.a,'value',{get(){return descriptor.get.call(this);},set(value){writes++;descriptor.set.call(this,value);},configurable:true});descriptor.set.call(f.a,'한글');fire(f.a,'input',{inputType:'insertText'});f.b.focus();await f.controller.settle();assert(writes===0&&f.a.value==='한글','브라우저 입력 값 덮어쓰기');}],
  ['Enter 채점 후 다음 입력칸 이동',async f=>{f.a.focus();f.input(f.a,'정답');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(f.log.enter.length===1&&f.log.enter[0]==='a'&&document.activeElement===f.b,'채점·이동 순서 오류');assert(f.a.value==='정답'&&f.b.value==='','이동 시 값 변경');},{advanceOnEnter:true}],
  ['숨김·비활성·읽기 전용 칸 건너뛰기',async f=>{const closed=document.createElement('details');closed.innerHTML='<summary>닫힘</summary><input type="text" data-id="hidden">';f.a.after(closed);f.b.disabled=true;f.c.readOnly=true;const next=document.createElement('input');next.type='text';next.dataset.id='next';f.root.append(next);f.a.focus();f.input(f.a,'답');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(document.activeElement===next,'입력할 수 없는 칸으로 이동');},{advanceOnEnter:true}],
  ['마지막 칸은 처음으로 되돌아가지 않음',async f=>{f.c.focus();f.input(f.c,'마지막 문장');fire(f.c,'keydown',{key:'Enter',ctrlKey:true});fire(f.c,'keyup',{key:'Enter',ctrlKey:true});await sleep(60);assert(f.log.enter.length===1&&document.activeElement===f.c,'마지막 칸 순환');},{advanceOnEnter:true}],
  ['자동 이동에서도 확정 Enter는 이동하지 않음',async f=>{f.a.focus();f.input(f.a,'하세');fire(f.a,'keydown',{key:'Enter'});f.input(f.a,'하세요');fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(!f.log.enter.length&&document.activeElement===f.a&&f.b.value==='','조합 확정 중 이동');},{advanceOnEnter:true}],
  ['자동 이동에서도 조합 중 Enter는 대기',async f=>{f.a.focus();fire(f.a,'compositionstart');f.input(f.a,'가',{isComposing:true});fire(f.a,'keydown',{key:'Enter',isComposing:true});fire(f.a,'keyup',{key:'Enter',isComposing:true});await sleep(60);assert(!f.log.enter.length&&document.activeElement===f.a,'조합 중 자동 이동');},{advanceOnEnter:true}],
  ['사용자가 먼저 옮긴 포커스는 유지',async f=>{f.a.focus();f.input(f.a,'답');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});f.b.focus();await sleep(60);assert(!f.log.enter.length&&document.activeElement===f.b,'이중 포커스 이동');},{advanceOnEnter:true}],
  ['문장은 Ctrl+Enter일 때만 다음 칸 이동',async f=>{const next=document.createElement('input');next.type='text';next.dataset.id='next';f.root.append(next);f.c.focus();f.input(f.c,'문장');fire(f.c,'keydown',{key:'Enter'});fire(f.c,'keyup',{key:'Enter'});await sleep(50);assert(document.activeElement===f.c&&!f.log.enter.length,'줄바꿈을 자동 이동으로 처리');fire(f.c,'keydown',{key:'Enter',ctrlKey:true});fire(f.c,'keyup',{key:'Enter',ctrlKey:true});await sleep(60);assert(document.activeElement===next&&f.log.enter.length===1,'문장 채점 후 이동 누락');},{advanceOnEnter:true}],
  ['다음 칸의 기존 답안 보존',async f=>{f.b.focus();f.input(f.b,'가가🙂');f.a.focus();f.input(f.a,'첫째 답');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(document.activeElement===f.b&&f.b.value==='가가🙂','기존 답안 덮어쓰기');},{advanceOnEnter:true}],
  ['닫힌 분류의 보이는 제목 칸은 이동 가능',async f=>{const closed=document.createElement('details');closed.innerHTML='<summary>분류 <input type="text" data-id="heading"></summary><input type="text" data-id="hidden">';f.a.after(closed);const heading=closed.querySelector('summary input');f.a.focus();f.input(f.a,'답');fire(f.a,'keydown',{key:'Enter'});fire(f.a,'keyup',{key:'Enter'});await sleep(60);assert(document.activeElement===heading,'보이는 제목 칸 생략');fire(heading,'keydown',{key:'Enter'});fire(heading,'keyup',{key:'Enter'});await sleep(60);assert(document.activeElement===f.b,'닫힌 본문 칸으로 이동');},{advanceOnEnter:true}],
  ['Shift+Enter로 이전 답안을 유지하며 이동',async f=>{f.a.focus();f.input(f.a,'기존 답안');f.b.focus();f.input(f.b,'작성 중');fire(f.b,'keydown',{key:'Enter',shiftKey:true});fire(f.b,'keyup',{key:'Enter',shiftKey:true});await sleep(60);assert(document.activeElement===f.a&&f.a.value==='기존 답안'&&f.b.value==='작성 중','이전 이동 또는 값 보존 실패');assert(!f.log.enter.length,'이전 이동에 채점 실행');},{advanceOnEnter:true,retreatOnShiftEnter:true}],
  ['역방향에서도 숨긴 칸과 읽기 전용 칸 건너뜀',async f=>{f.b.readOnly=true;const closed=document.createElement('details');closed.innerHTML='<summary>숨김</summary><input type="text" data-id="hidden">';f.b.after(closed);f.c.focus();fire(f.c,'keydown',{key:'Enter',shiftKey:true});fire(f.c,'keyup',{key:'Enter',shiftKey:true});await sleep(60);assert(document.activeElement===f.a,'역방향 숨김 칸 진입');},{retreatOnShiftEnter:true}],

  ['문장 Shift+Enter는 줄바꿈 없이 이전 칸 이동',async f=>{f.c.focus();f.input(f.c,'문장');assert(fire(f.c,'keydown',{key:'Enter',shiftKey:true}).defaultPrevented,'Shift+Enter 줄바꿈 차단 실패');fire(f.c,'keyup',{key:'Enter',shiftKey:true});await sleep(60);assert(document.activeElement===f.b&&f.c.value==='문장','문장 역방향 이동 실패');},{retreatOnShiftEnter:true}],
  ['조합 중 Shift+Enter도 포커스 유지',async f=>{f.b.focus();fire(f.b,'compositionstart');f.input(f.b,'가',{isComposing:true});fire(f.b,'keydown',{key:'Enter',shiftKey:true,isComposing:true});fire(f.b,'keyup',{key:'Enter',shiftKey:true,isComposing:true});await sleep(60);assert(document.activeElement===f.b&&!f.log.enter.length,'조합 중 역방향 이동');},{retreatOnShiftEnter:true}],

  ['입력칸 밖 C는 정답 표시/숨김',async f=>{document.activeElement?.blur();await sleep(60);assert(fire(document.body,'keydown',{key:'c'}).defaultPrevented,'C 단축키 누락');await sleep(60);assert(f.log.reveal===1,'C 처리 횟수 오류');fire(document.body,'keydown',{key:'C',shiftKey:true});await sleep(60);assert(f.log.reveal===2,'대문자 C 누락');},{revealShortcut:true}],
  ['입력칸의 c와 조합 키는 정답을 표시하지 않음',async f=>{f.a.focus();assert(!fire(f.a,'keydown',{key:'c'}).defaultPrevented,'c 입력 차단');f.input(f.a,'c');await sleep(60);assert(f.log.reveal===0&&f.values.a==='c','입력 중 정답 표시');f.a.blur();await sleep(60);for(const init of [{ctrlKey:true},{metaKey:true},{altKey:true},{repeat:true},{isComposing:true},{keyCode:229}])fire(document.body,'keydown',{key:'c',...init});await sleep(60);assert(f.log.reveal===0,'수정키 또는 조합 키 가로채기');},{revealShortcut:true}],
  ['편집 가능한 요소 안의 C는 입력으로 유지',async f=>{const editor=document.createElement('div');editor.contentEditable='true';editor.innerHTML='<span>편집 중</span>';f.root.append(editor);editor.focus();const event=fire(editor.firstElementChild,'keydown',{key:'c'});await sleep(60);assert(!event.defaultPrevented&&f.log.reveal===0,'편집 가능한 요소의 C 가로채기');},{revealShortcut:true}]

 ];
 $('run-tests').onclick=async()=>{
  $('run-tests').disabled=true;const results=[];
  try{for(const [name,run,settings]of cases){const f=fixture(settings);try{await run(f);results.push('PASS '+name);}catch(error){results.push('FAIL '+name+' — '+error.message);}finally{if(f.root.contains(document.activeElement))document.activeElement.blur();await sleep(280);f.root.remove();}}}finally{$('run-tests').disabled=false;const passed=results.filter(x=>x.startsWith('PASS')).length;$('test-result').textContent=passed+'/'+cases.length+' 통과\n'+results.join('\n');}
 };
})();
</script></body></html>
